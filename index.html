<!DOCTYPE html>
<html><!-- pas de lang : posé par le proxy data-fair -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <!-- ordre des cascade layers épinglé avant tout style : Vuetify 4 livre son CSS
         en layers, la priorité dépend de l'ordre de première déclaration des noms -->
    <style>@layer vuetify-core, vuetify-components, vuetify-overrides, vuetify-utilities, vuetify-final;</style>
    <link href="/simple-directory/api/sites/_theme.css" rel="stylesheet">
    <script src="/simple-directory/api/sites/_public.js"></script>

    <title>Calendar</title>

    <!-- contrat data-fair, lu à l'exécution -->
    <meta name="df:vjsf" content="3" />
    <meta name="df:filter-concepts" content="true" />
    <meta name="df:sync-config" content="true" />
    <meta name="df:sync-state" content="true" />
    <meta name="df:overflow" content="true" />
    <meta name="df:capture-delay" content="5" />

    <!-- catalogue, lu à l'import -->
    <meta name="application-name" content="Application Calendrier" />
    <meta name="description" content="Une application de type calendrier" />

    <!-- contrat data-fair : global posé par le proxy (substitution de %APPLICATION%) -->
    <script type="text/javascript">window.APPLICATION=%APPLICATION%;</script>
  </head>
  <body>
    <main id="app" style="height:100vh"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
